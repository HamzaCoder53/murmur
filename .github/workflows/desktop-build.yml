name: Desktop Build (macOS + Windows)

on:
  push:
    branches: ["desktop/**"]
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "app/src/main/java/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos_arm64
            format: Dmg
            rid: osx-arm64
          - os: macos-15-intel
            target: macos_x64
            format: Dmg
            rid: osx-x64
          - os: windows-latest
            target: windows_x64
            format: Msi
            rid: win-x64
          - os: windows-11-arm
            target: windows_arm64
            format: Msi
            rid: win-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build macOS Swift BLE helper
        if: runner.os == 'macOS'
        run: |
          if [ -f desktop/ble-mac/Sources/main.swift ]; then
            mkdir -p desktop/build/ble-mac
            swiftc -O -framework CoreBluetooth -framework Foundation \
              desktop/ble-mac/Sources/main.swift \
              -o desktop/build/ble-mac/skein-ble-mac
          fi

      - name: Build Windows WinRT BLE helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path desktop/ble-windows/SkeinBleWindows.csproj) {
            dotnet publish desktop/ble-windows/SkeinBleWindows.csproj `
              -c Release -r ${{ matrix.rid }} --self-contained true `
              -p:PublishSingleFile=true `
              -o desktop/build/ble-windows
          }

      - name: Run desktop unit tests & smoke check
        run: ./gradlew :desktop:test :desktop:run --args=--smoke --no-daemon

      # SKEIN_SENTRY_DSN is baked into the app as a resource here (see desktop/build.gradle.kts);
      # without the secret the installer ships with crash reporting unavailable.
      - name: Package native installer (${{ matrix.format }})
        env:
          SKEIN_SENTRY_DSN: ${{ secrets.SKEIN_SENTRY_DSN }}
        run: ./gradlew :desktop:package${{ matrix.format }} -PskeinTarget=${{ matrix.target }} --no-daemon

      # The packaged app runs on its own jlinked runtime, not the CI JDK, so a missing JDK module
      # only shows up here.
      - name: Smoke-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: desktop/build/compose/binaries/main/app/Skein.app/Contents/MacOS/Skein --smoke

      - name: Smoke-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath desktop/build/compose/binaries/main/app/Skein/Skein.exe `
            -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "packaged smoke check failed (exit $($p.ExitCode))" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skein-desktop-${{ matrix.target }}
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  # A desktop-v* tag attaches the installers to a *draft* GitHub Release. Publishing it stays a
  # manual step (docs/desktop-build-plan.md: never publish without the maintainer). Builds are
  # unsigned for now, per the plan, so the release notes say so.
  release:
    name: Attach installers to draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: skein-desktop-*
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum * > SHA256SUMS)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Skein desktop ${TAG#desktop-v}" \
              --notes "Unsigned macOS DMG and Windows MSI builds. macOS: right-click Open on first launch. Windows: SmartScreen > More info > Run anyway."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
